<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
        <script type="text/javascript" src="https://cdn.cycling74.com/rnbo/1.3.3/rnbo.min.js"></script>
    </head>
    <body>
        <div id="main">
            <div id="interface">
                <div id="star-wrap">
                    <div class="star" onclick="startMic()"></div>
                    <input class="center" type="range" min="0" max="100" step="1" id="decaySlider" name="decaySlider" >
                    <input class="center" type="range" min="0" max="1" step="0.01" id="volumeSlider" name="volumeSlider">
                    <input class="center" type="range" min="-12" max="24" step="1" id="pitchSlider" name="pitchSlider">
                    <input class="center" type="range" min="0" max="100" step="1" id="octaveVolSlider" name="octaveVolSlider">
                </div>
            </div>
        </div> 
    </body>
    <script src="instrument-feedback.js"></script>
</html>
